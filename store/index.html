    <h3 class="ab-pin-title">🔒 الدخول إلى أسعار الجملة</h3>

    <div id="abPinErr" class="ab-pin-err"></div>
    <div class="ab-pin-actions">
      <button type="button" class="ab-pin-ok" onclick="abVerifyWholesalePin()">دخول للجملة</button>

<script>
(function(){
  var IS_WHOLESALE = false;
  var REQ_PIN = '111';
  if (IS_WHOLESALE) {
    try { sessionStorage.setItem('ab_wh_unlocked', '1'); } catch(e) {}
  }
  function normDigits(s) {
    return String(s || '')
      .replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
      .replace(/[۰-۹]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
      .replace(/\s+/g, '');
  }
  window.abClosePinModal = function() {
    var m = document.getElementById('abPinModal');
    if (m) m.classList.remove('open');
  };
  window.abSwitchStoreMode = function(mode) {
    if (mode === 'retail') {
      if (!IS_WHOLESALE) return;
      window.location.href = './index.html';
      return;
    }
    if (IS_WHOLESALE) return;
    var unlocked = false;
    try {
      unlocked = (localStorage.getItem('ab_wh_pin_ok') === REQ_PIN) || (sessionStorage.getItem('ab_wh_unlocked') === '1');
    } catch(e) {}
    if (!REQ_PIN || unlocked) {
      window.location.href = './wholesale.html';
      return;
    }
    var m = document.getElementById('abPinModal');
    var inp = document.getElementById('abPinInput');
    var err = document.getElementById('abPinErr');
    if (err) err.textContent = '';
    if (inp) inp.value = '';
    if (m) m.classList.add('open');
    setTimeout(function(){ if (inp) inp.focus(); }, 80);
  };
  window.abVerifyWholesalePin = function() {
    var inp = document.getElementById('abPinInput');
    var err = document.getElementById('abPinErr');
    var val = normDigits(inp ? inp.value : '');
    if (val === REQ_PIN) {
      try {
        localStorage.setItem('ab_wh_pin_ok', REQ_PIN);
        sessionStorage.setItem('ab_wh_unlocked', '1');
      } catch(e) {}
      window.location.href = './wholesale.html';
    } else {
      if (err) err.textContent = '❌ الرمز السري غير صحيح، حاول مرة أخرى.';
      if (inp) { inp.value = ''; inp.focus(); }
    }
  };
})();
</script>

<script data-ab-potato-ver="2">
(function () {
  if (window.__abPotatoV2Installed) return;
  window.__abPotatoV2Installed = true;
  window.__abPotatoOpen = false;
  window.__abPotatoSize = 'all';
  var isApplying = false;

  function getSizeKey(text) {
    if (text.indexOf('صغير') !== -1) return 'small';
    if (text.indexOf('وسط') !== -1) return 'medium';
    if (text.indexOf('كبير') !== -1) return 'large';
    return 'other';
  }

  function applySizeFilter() {
    var grid = document.getElementById('abPotInnerGrid');
    if (!grid) return;
    var size = window.__abPotatoSize || 'all';
    var cards = grid.children;
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      var k = c.getAttribute('data-pot-size') || 'other';
      c.style.display = (size === 'all' || k === size) ? '' : 'none';
    }
    var tabs = document.querySelectorAll('.ab-pot-tab');
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.toggle('active', tabs[j].getAttribute('data-size') === size);
    }
  }

  function refreshSelectedBadge() {
    var inner = document.getElementById('abPotInnerGrid');
    var badge = document.getElementById('abPotSelBadge');
    if (!inner || !badge) return;
    var selCount = inner.querySelectorAll('.selected').length;
    if (selCount > 0) {
      badge.textContent = '✓ في الفاتورة: ' + selCount;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  }

  function setPanelOpen(isOpen) {
    var panel = document.getElementById('abPotPanel');
    var arrow = document.getElementById('abPotArrow');
    if (panel) panel.classList.toggle('open', !!isOpen);
    if (arrow) arrow.textContent = isOpen ? '▲ إخفاء' : '▼ عرض';
  }

  function buildPotatoDropdown() {
    if (isApplying) return;
    var prodGrid = document.getElementById('prodGrid');
    if (!prodGrid) return;

    if (prodGrid.querySelector('#abPotWrap')) {
      refreshSelectedBadge();
      return;
    }

    var children = Array.prototype.slice.call(prodGrid.children);
    var potatoCards = [];
    var potatoHeaders = [];
    var nonPotatoCount = 0;
    var insertBeforeNode = null;

    for (var i = 0; i < children.length; i++) {
      var el = children[i];
      if (!el || el.id === 'abPotWrap') continue;
      var tag = (el.tagName || '').toUpperCase();
      if (tag === 'SCRIPT' || tag === 'STYLE') continue;

      var txt = (el.textContent || '').trim();
      var isHdr = el.classList && (el.classList.contains('ab-sec-hdr') || el.classList.contains('ab-sub-hdr'));

      if (txt.indexOf('بطاطس') !== -1) {
        if (isHdr) {
          potatoHeaders.push(el);
        } else {
          if (!insertBeforeNode) insertBeforeNode = el;
          potatoCards.push(el);
        }
      } else if (!isHdr) {
        nonPotatoCount++;
      }
    }

    if (potatoCards.length === 0) return;

    isApplying = true;
    try {
      for (var h = 0; h < potatoHeaders.length; h++) {
        potatoHeaders[h].style.setProperty('display', 'none', 'important');
      }

      var cntAll = potatoCards.length;
      var cntSmall = 0, cntMed = 0, cntLarge = 0;
      var thumbSrc = '';

      for (var c = 0; c < potatoCards.length; c++) {
        var card = potatoCards[c];
        var sk = getSizeKey(card.textContent || '');
        card.setAttribute('data-pot-size', sk);
        if (sk === 'small') cntSmall++;
        else if (sk === 'medium') cntMed++;
        else if (sk === 'large') cntLarge++;
        if (!thumbSrc) {
          var img = card.querySelector('img');
          if (img && img.getAttribute('src')) thumbSrc = img.getAttribute('src');
        }
      }

      var searchEl = document.getElementById('searchInp');
      var isSearching = searchEl && (searchEl.value || '').trim().length > 0;
      var onlyPotatoesShown = (nonPotatoCount === 0);
      var shouldOpen = (isSearching || onlyPotatoesShown) ? true : Boolean(window.__abPotatoOpen);

      var wrap = document.createElement('div');
      wrap.id = 'abPotWrap';
      wrap.className = 'ab-pot-wrap';

      var thumbHtml = thumbSrc ? ('<img class="ab-pot-thumb" src="' + thumbSrc + '" alt="بطاطس طبيعي">') : '';

      wrap.innerHTML =
        '<button type="button" id="abPotToggleBtn" class="ab-pot-toggle">' +
          '<div class="ab-pot-left">' +
            thumbHtml +
            '<div class="ab-pot-info">' +
              '<div class="ab-pot-title">' +
                '<span>🥔 بطاطس طبيعي رنجو</span>' +
                '<span class="ab-pot-cnt">' + cntAll + ' صنف</span>' +
                '<span id="abPotSelBadge" class="ab-pot-sel-badge" style="display:none;"></span>' +
              '</div>' +
              '<div class="ab-pot-sub">اضغط لعرض الأحجام والنكهات (صغير • وسط • كبير)</div>' +
            '</div>' +
          '</div>' +
          '<span id="abPotArrow" class="ab-pot-arrow">' + (shouldOpen ? '▲ إخفاء' : '▼ عرض') + '</span>' +
        '</button>' +
        '<div id="abPotPanel" class="ab-pot-panel' + (shouldOpen ? ' open' : '') + '">' +
          '<div class="ab-pot-tabs">' +
            '<button type="button" class="ab-pot-tab" data-size="all">الكل (' + cntAll + ')</button>' +
            '<button type="button" class="ab-pot-tab" data-size="small">صغير (' + cntSmall + ')</button>' +
            '<button type="button" class="ab-pot-tab" data-size="medium">وسط (' + cntMed + ')</button>' +
            '<button type="button" class="ab-pot-tab" data-size="large">كبير (' + cntLarge + ')</button>' +
          '</div>' +
          '<div id="abPotInnerGrid" class="ab-pot-grid"></div>' +
        '</div>';

      prodGrid.insertBefore(wrap, insertBeforeNode);

      var innerGrid = wrap.querySelector('#abPotInnerGrid');
      for (var k = 0; k < potatoCards.length; k++) {
        innerGrid.appendChild(potatoCards[k]);
      }

      wrap.querySelector('#abPotToggleBtn').addEventListener('click', function () {
        var panel = wrap.querySelector('#abPotPanel');
        window.__abPotatoOpen = !panel.classList.contains('open');
        setPanelOpen(window.__abPotatoOpen);
      });

      var tabBtns = wrap.querySelectorAll('.ab-pot-tab');
      for (var t = 0; t < tabBtns.length; t++) {
        tabBtns[t].addEventListener('click', function () {
          window.__abPotatoSize = this.getAttribute('data-size') || 'all';
          applySizeFilter();
        });
      }

      if (isSearching || onlyPotatoesShown) {
        window.__abPotatoSize = 'all';
      }
      applySizeFilter();
      refreshSelectedBadge();
    } finally {
      isApplying = false;
    }
  }

  function attachObserver() {
    var prodGrid = document.getElementById('prodGrid');
    if (!prodGrid || prodGrid.__abPotObs) return;
    prodGrid.__abPotObs = true;
    try {
      var obs = new MutationObserver(function () {
        if (!isApplying) buildPotatoDropdown();
      });
      obs.observe(prodGrid, { childList: true });
    } catch (e) {}
  }

  if (typeof window.renderCatalog === 'function' && !window.renderCatalog.__abWrappedPotatoV2) {
    var origRender = window.renderCatalog;
    window.renderCatalog = function () {
      var res = origRender.apply(this, arguments);
      try { buildPotatoDropdown(); } catch (e) {}
      return res;
    };
    window.renderCatalog.__abWrappedPotatoV2 = true;
  }

  document.addEventListener('click', function () {
    setTimeout(refreshSelectedBadge, 90);
  }, true);

  function initAll() {
    attachObserver();
    try { buildPotatoDropdown(); } catch (e) {}
  }

  initAll();
  document.addEventListener('DOMContentLoaded', initAll);
  window.addEventListener('load', function () {
    initAll();
    setTimeout(initAll, 250);
  });
})();
</script>

<script data-ab-wh-ver="2">
(function () {
  if (window.__abWhSendV2) return;
  window.__abWhSendV2 = true;

  var STORAGE_KEY = 'ab_warehouse_phone_v2';
  var DEFAULT_PHONE = '967772777609';

  function cleanPhone(raw) {
    var d = String(raw || '').replace(/[^0-9]/g, '');
    if (d.indexOf('00') === 0) d = d.slice(2);
    if (d.length === 9 && d.indexOf('7') === 0) d = '967' + d;
    return d;
  }

  function getPhone() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved && cleanPhone(saved).length >= 9) return cleanPhone(saved);
    } catch (e) {}
    return DEFAULT_PHONE;
  }

  function savePhone(val) {
    var p = cleanPhone(val);
    if (p.length < 9) {
      alert('الرجاء إدخال رقم واتساب صحيح (مثال: 967772777609)');
      return false;
    }
    try { localStorage.setItem(STORAGE_KEY, p); } catch (e) {}
    return p;
  }

  function sendToWarehouse(withPrice) {
    var phone = getPhone();
    var cartObj = (typeof CART !== 'undefined' && CART) ? CART : {};
    var prods = (typeof PRODUCTS !== 'undefined' && Array.isArray(PRODUCTS)) ? PRODUCTS : [];
    var items = [];
    var grandTotal = 0;
    var totalQty = 0;

    for (var i = 0; i < prods.length; i++) {
      var p = prods[i];
      var q = Number(cartObj[p.id] || 0);
      if (q > 0) {
        var bon = (typeof calcBonus === 'function') ? Number(calcBonus(p, q) || 0) : 0;
        var sub = q * Number(p.price || 0);
        grandTotal += sub;
        totalQty += q;
        items.push({ name: p.name, unit: p.unit || 'كرتون', qty: q, bon: bon, price: Number(p.price || 0), sub: sub });
      }
    }

    if (items.length === 0) {
      if (typeof showToast === 'function') showToast('⚠️ الفاتورة فارغة — اختر أصنافاً أولاً');
      else alert('الفاتورة فارغة — اختر أصنافاً أولاً');
      return;
    }

    var fmtNum = (typeof fmt === 'function') ? fmt : function (n) { return Number(n || 0).toLocaleString('en-US'); };
    var lines = [];

    if (withPrice) {
      lines.push('📦 *طلب تجهيز مستودع (بالسعر)*');
      lines.push('🏪 *ابوضياء للتوزيع*');
      lines.push('━━━━━━━━━━━━━━');
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        var bonTxt = it.bon > 0 ? (' (+' + it.bon + ' مجاني)') : '';
        lines.push((j + 1) + '. ' + it.name);
        lines.push('   الكمية: *' + it.qty + '* ' + it.unit + bonTxt + ' × ' + fmtNum(it.price) + ' = *' + fmtNum(it.sub) + ' ر.ي*');
      }
      lines.push('━━━━━━━━━━━━━━');
      lines.push('📊 إجمالي الوحدات: *' + totalQty + '*');
      lines.push('💰 الإجمالي: *' + fmtNum(grandTotal) + ' ر.ي*');
    } else {
      lines.push('📦 *كشف تجهيز مستودع (مختصر)*');
      lines.push('━━━━━━━━━━━━━━');
      for (var k = 0; k < items.length; k++) {
        var m = items[k];
        var bTxt = m.bon > 0 ? (' (+' + m.bon + ' 🎁)') : '';
        lines.push('• ' + m.name + ' : *' + m.qty + '* ' + m.unit + bTxt);
      }
      lines.push('━━━━━━━━━━━━━━');
      lines.push('📊 إجمالي الوحدات: *' + totalQty + '*');
    }

    var url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(lines.join('
'));
    window.open(url, '_blank');
  }

  function mountWarehouseBox() {
    if (document.getElementById('abWhBox')) return;
    var anchor = document.querySelector('.inv-totals-card') ||
                 document.getElementById('invoiceView') ||
                 document.querySelector('[id*="invoice"], [class*="invoice"]');
    if (!anchor) return;

    var curPhone = getPhone();
    var box = document.createElement('div');
    box.id = 'abWhBox';
    box.className = 'ab-wh-box';
    box.innerHTML =
      '<div class="ab-wh-head">' +
        '<div class="ab-wh-title">📦 إرسال الطلب لإدارة المستودع</div>' +
        '<button type="button" id="abWhEditBtn" class="ab-wh-edit-btn">⚙️ رقم المستودع</button>' +
      '</div>' +
      '<div id="abWhPhoneRow" class="ab-wh-phone-row">' +
        '<input type="tel" id="abWhPhoneInp" class="ab-wh-inp" placeholder="967772777609" value="' + curPhone + '">' +
        '<button type="button" id="abWhSaveBtn" class="ab-wh-save">حفظ</button>' +
      '</div>' +
      '<div class="ab-wh-btns">' +
        '<button type="button" id="abWhBtnPrice" class="ab-wh-btn ab-wh-btn-price">💰 إرسال بالسعر</button>' +
        '<button type="button" id="abWhBtnShort" class="ab-wh-btn ab-wh-btn-short">📋 مختصر بدون سعر</button>' +
      '</div>';

    if (anchor.classList && anchor.classList.contains('inv-totals-card') && anchor.parentNode) {
      anchor.parentNode.insertBefore(box, anchor.nextSibling);
    } else {
      anchor.appendChild(box);
    }

    document.getElementById('abWhEditBtn').addEventListener('click', function () {
      document.getElementById('abWhPhoneRow').classList.toggle('open');
    });
    document.getElementById('abWhSaveBtn').addEventListener('click', function () {
      var saved = savePhone(document.getElementById('abWhPhoneInp').value);
      if (saved) {
        document.getElementById('abWhPhoneInp').value = saved;
        document.getElementById('abWhPhoneRow').classList.remove('open');
        if (typeof showToast === 'function') showToast('✅ تم حفظ رقم إدارة المستودع');
      }
    });
    document.getElementById('abWhBtnPrice').addEventListener('click', function () { sendToWarehouse(true); });
    document.getElementById('abWhBtnShort').addEventListener('click', function () { sendToWarehouse(false); });
  }

  if (typeof window.renderInvoiceView === 'function' && !window.renderInvoiceView.__abWrappedWhV2) {
    var origInv = window.renderInvoiceView;
    window.renderInvoiceView = function () {
      var res = origInv.apply(this, arguments);
      setTimeout(mountWarehouseBox, 20);
      return res;
    };
    window.renderInvoiceView.__abWrappedWhV2 = true;
  }

  document.addEventListener('click', function () { setTimeout(mountWarehouseBox, 120); }, true);
  document.addEventListener('DOMContentLoaded', mountWarehouseBox);
  window.addEventListener('load', function () {
    mountWarehouseBox();
    setTimeout(mountWarehouseBox, 400);
  });
})();
</script>
<!-- ABUDHIYA_WAREHOUSE_SEND_END -->
