<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>أبوضياء للتوزيع</title><script>location.replace(location.search.indexOf("wholesale")!==-1?"../wholesale.html":"../");</script></head><body>
<!-- ABUDHIYA_PWA_SWITCHER_START -->
<style>
  .ab-sw-wrap{max-width:900px;margin:8px auto 4px;padding:0 12px;direction:rtl;font-family:'IBM Plex Sans Arabic',sans-serif !important;}
  .ab-sw-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#FFFFFF;border:2px solid #000000;border-radius:12px;padding:5px;}
  .ab-sw-btn{appearance:none;border:1.5px solid #000000;background:#FFFFFF;color:#000000;border-radius:9px;padding:10px 8px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;transition:0.15s;}
  .ab-sw-btn.ab-sw-active{background:#000000 !important;color:#FFFFFF !important;border-color:#000000 !important;}
  .ab-sw-note{text-align:center;font-size:12px;font-weight:700;color:#000000;margin-top:5px;}
  .ab-pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.68);z-index:99999;display:none;align-items:center;justify-content:center;padding:16px;direction:rtl;}
  .ab-pin-overlay.open{display:flex;}
  .ab-pin-box{width:100%;max-width:340px;background:#FFFFFF;color:#000000;border:2.5px solid #000000;border-radius:16px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,0.35);text-align:center;}
  .ab-pin-title{margin:0 0 6px;font-size:16px;font-weight:700;color:#000000;}
  .ab-pin-sub{margin:0 0 12px;font-size:12.5px;color:#333333;font-weight:500;}
  .ab-pin-input{width:100%;padding:11px;font-size:20px;font-weight:700;letter-spacing:6px;text-align:center;border:2px solid #000000;border-radius:10px;background:#FFFFFF;color:#000000;outline:none;box-sizing:border-box;}
  .ab-pin-err{min-height:18px;margin:7px 0 8px;font-size:12px;font-weight:700;color:#B91C1C;}
  .ab-pin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ab-pin-ok{background:#000000;color:#FFFFFF;border:2px solid #000000;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;}
  .ab-pin-cancel{background:#FFFFFF;color:#000000;border:2px solid #000000;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;}
</style>
<div class="ab-sw-wrap" id="abPwaPriceSwitcher">
  <div class="ab-sw-bar">
    <button type="button" class="ab-sw-btn ab-sw-active" onclick="abSwitchStoreMode('retail')">🛒 سعر التجزئة</button>
    <button type="button" class="ab-sw-btn" onclick="abSwitchStoreMode('wholesale')">🏷️ سعر الجملة</button>
  </div>
  <div class="ab-sw-note">🛒 أنت تتصفح الآن: قائمة أسعار التجزئة</div>
</div>
<div class="ab-pin-overlay" id="abPinModal" onclick="if(event.target===this) abClosePinModal();">
  <div class="ab-pin-box">
    <h3 class="ab-pin-title">🔒 الدخول إلى أسعار الجملة</h3>
    <p class="ab-pin-sub">أدخل الرمز السري المعتمد لعملاء الجملة</p>
    <input id="abPinInput" class="ab-pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="•••" onkeydown="if(event.key==='Enter') abVerifyWholesalePin();">
    <div id="abPinErr" class="ab-pin-err"></div>
    <div class="ab-pin-actions">
      <button type="button" class="ab-pin-ok" onclick="abVerifyWholesalePin()">دخول للجملة</button>
      <button type="button" class="ab-pin-cancel" onclick="abClosePinModal()">إلغاء</button>
    </div>
  </div>
</div>
<script>
(function(){
  var IS_WHOLESALE = false;
  var REQ_PIN = '111';
  if (IS_WHOLESALE) {
    try { sessionStorage.setItem('ab_wh_unlocked', '1'); } catch(e) {}
  }
  function normDigits(s) {
    return String(s || '')
      .replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
      .replace(/[۰-۹]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
      .replace(/\s+/g, '');
  }
  window.abClosePinModal = function() {
    var m = document.getElementById('abPinModal');
    if (m) m.classList.remove('open');
  };
  window.abSwitchStoreMode = function(mode) {
    if (mode === 'retail') {
      if (!IS_WHOLESALE) return;
      window.location.href = './index.html';
      return;
    }
    if (IS_WHOLESALE) return;
    var unlocked = false;
    try {
      unlocked = (localStorage.getItem('ab_wh_pin_ok') === REQ_PIN) || (sessionStorage.getItem('ab_wh_unlocked') === '1');
    } catch(e) {}
    if (!REQ_PIN || unlocked) {
      window.location.href = './wholesale.html';
      return;
    }
    var m = document.getElementById('abPinModal');
    var inp = document.getElementById('abPinInput');
    var err = document.getElementById('abPinErr');
    if (err) err.textContent = '';
    if (inp) inp.value = '';
    if (m) m.classList.add('open');
    setTimeout(function(){ if (inp) inp.focus(); }, 80);
  };
  window.abVerifyWholesalePin = function() {
    var inp = document.getElementById('abPinInput');
    var err = document.getElementById('abPinErr');
    var val = normDigits(inp ? inp.value : '');
    if (val === REQ_PIN) {
      try {
        localStorage.setItem('ab_wh_pin_ok', REQ_PIN);
        sessionStorage.setItem('ab_wh_unlocked', '1');
      } catch(e) {}
      window.location.href = './wholesale.html';
    } else {
      if (err) err.textContent = '❌ الرمز السري غير صحيح، حاول مرة أخرى.';
      if (inp) { inp.value = ''; inp.focus(); }
    }
  };
})();
</script>
<!-- ABUDHIYA_PWA_SWITCHER_END --><!-- ABUDHIYA_LIFT_BOTTOM_START -->
<style>
  body { padding-bottom: 155px !important; }
</style>
<script>
(function(){
  function liftBottomControls() {
    var vh = window.innerHeight || document.documentElement.clientHeight || 800;
    var vw = window.innerWidth || document.documentElement.clientWidth || 360;
    var nodes = document.body ? document.body.querySelectorAll('*') : [];

    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (!el || el.dataset.abLifted === '1') continue;
      if (el.closest && el.closest('[data-ab-lifted="1"]')) continue;

      var tag = (el.tagName || '').toUpperCase();
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'IFRAME' || tag === 'LINK' || tag === 'META') continue;
      if (el.id === 'abPinModal' || (el.classList && el.classList.contains('ab-pin-overlay'))) continue;

      var meta = ((el.id || '') + ' ' + (typeof el.className === 'string' ? el.className : '') + ' ' + (el.getAttribute('aria-label') || '')).toLowerCase();
      if (meta.indexOf('netlify') !== -1) continue;

      var cs = window.getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') continue;
      if (cs.position !== 'fixed' && cs.position !== 'sticky') continue;

      var rect = el.getBoundingClientRect();
      if (rect.height < 20 || rect.height > 170) continue;
      if (rect.top < vh * 0.45) continue;
      if ((vh - rect.bottom) > 42) continue;

      var txt = (el.textContent || '').toLowerCase();
      if (txt.indexOf('powered by netlify') !== -1) continue;

      el.dataset.abLifted = '1';
      if (rect.width >= vw * 0.78) {
        el.style.setProperty('bottom', '64px', 'important');
        el.style.setProperty('left', '8px', 'important');
        el.style.setProperty('right', '8px', 'important');
        el.style.setProperty('width', 'auto', 'important');
        el.style.setProperty('max-width', '900px', 'important');
        el.style.setProperty('margin', '0 auto', 'important');
        el.style.setProperty('border-radius', '14px', 'important');
        el.style.setProperty('box-shadow', '0 8px 24px rgba(0,0,0,0.45)', 'important');
        el.style.setProperty('z-index', '9990', 'important');
      } else {
        var curBottom = parseFloat(cs.bottom);
        if (isNaN(curBottom) || curBottom < 0) curBottom = 0;
        el.style.setProperty('bottom', (curBottom + 66) + 'px', 'important');
        el.style.setProperty('z-index', '9991', 'important');
      }
    }
  }

  document.addEventListener('DOMContentLoaded', liftBottomControls);
  window.addEventListener('load', function(){
    liftBottomControls();
    setTimeout(liftBottomControls, 350);
    setTimeout(liftBottomControls, 1200);
  });
  window.addEventListener('resize', liftBottomControls);
  document.addEventListener('click', function(){ setTimeout(liftBottomControls, 80); }, true);
})();
</script>
<!-- ABUDHIYA_LIFT_BOTTOM_END -->
</body></html>
